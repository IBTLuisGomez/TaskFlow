spring:
    application:
        name: taskflow
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
        username: ${DB_USER:taskflow}
        password: ${DB_PASSWORD:taskflow_dev}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
server:
    port: 8080
