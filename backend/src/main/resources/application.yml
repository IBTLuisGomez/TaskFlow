spring:
    application:
        name: taskflow
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
        username: ${DB_USER:taskflow}
        password: ${DB_PASSWORD:taskflow_dev}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
server:
    port: 8080
management:
    endpoints:
        web:
            exposure:
                include: health,info
taskflow:
    notification:
        from: taskflow@localhost
        to: ${NOTIFY_TO:team@taskflow.local}
